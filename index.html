<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mithi! ✨🎂</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #a1c4fd);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.85);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .active { display: flex !important; }

        h1 { color: #ff0055; margin-bottom: 15px; }
        
        .gift-btn {
            font-size: 80px;
            cursor: pointer;
            margin: 20px 0;
            user-select: none;
        }

        .btn {
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 1rem;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .balloon-container {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .balloon {
            font-size: 50px;
            cursor: pointer;
        }

        .photo-placeholder {
            width: 200px;
            height: 250px;
            border-radius: 15px;
            object-fit: cover;
            border: 4px solid #fff;
            margin-bottom: 15px;
        }

        .message-box {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            color: #d81b60;
            font-weight: bold;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1 -->
    <div id="screen1" class="screen active">
        <h1>HAPPY BIRTHDAY MITHI</h1>
        <div class="gift-btn" onclick="showScreen('screen2')">🎁</div>
        <p style="color:#d81b60; font-weight:bold;">गिफ़्ट बॉक्स पर क्लिक करें!</p>
    </div>

    <!-- SCREEN 2 -->
    <div id="screen2" class="screen">
        <h2>एक गुब्बारा चुनें! 🎈</h2>
        <div class="balloon-container">
            <div class="balloon" onclick="showScreen('screen3')">🎈</div>
            <div class="balloon" onclick="showScreen('screen4')">🎈</div>
            <div class="balloon" onclick="showScreen('screen5')">🎈</div>
        </div>
    </div>

    <!-- SCREEN 3 -->
    <div id="screen3" class="screen">
        <img src="photo1.jpg" class="photo-placeholder" onerror="this.src='https://via.placeholder.com/200x250?text=Photo+1'">
        <div class="message-box">
            मेरी प्यारी बहन मीठी को जन्मदिन की बहुत-बहुत शुभकामनाएं! 🎂🎉
        </div>
        <button class="btn" onclick="showScreen('screen2')">⬅ वापस जाएं</button>
    </div>

    <!-- SCREEN 4 -->
    <div id="screen4" class="screen">
        <img src="photo2.jpg" class="photo-placeholder" onerror="this.src='https://via.placeholder.com/200x250?text=Photo+2'">
        <div class="message-box">
            तुम हमेशा ऐसे ही मुस्कुराती रहो और जीवन में आगे बढ़ो! ✨🌸
        </div>
        <button class="btn" onclick="showScreen('screen2')">⬅ वापस जाएं</button>
    </div>

    <!-- SCREEN 5 -->
    <div id="screen5" class="screen">
        <img src="photo3.jpg" class="photo-placeholder" onerror="this.src='https://via.placeholder.com/200x250?text=Photo+3'">
        <div class="message-box">
            💖 HAPPY BIRTHDAY MITHI 💖
        </div>
        <button class="btn" onclick="showScreen('screen2')">⬅ वापस जाएं</button>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
